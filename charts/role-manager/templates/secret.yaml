{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "role-manager.secretName" . }}
  labels:
    {{- include "role-manager.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secretKey }}: {{ required "Set auth.adminToken (at least 32 characters) or auth.existingSecret" .Values.auth.adminToken | b64enc | quote }}
{{- end }}
