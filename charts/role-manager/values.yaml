replicaCount: 1
nameOverride: ""
fullnameOverride: ""

image:
  repository: role-manager
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []

auth:
  adminToken: ""
  existingSecret: ""
  secretKey: ADMIN_TOKEN

rbac:
  create: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 80
  nodePort: null
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: role-manager.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10
  timeoutSeconds: 20

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 20

nodeSelector: {}
tolerations: []
affinity: {}
