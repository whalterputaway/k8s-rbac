apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: role-manager
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
secretGenerator:
  - name: role-manager-auth
    envs:
      - admin.env
images:
  - name: role-manager
    newName: role-manager
    newTag: dev
